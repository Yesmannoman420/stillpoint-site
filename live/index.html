<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Still Point Live</title>
<style>
  :root { --ink:#0b0d0c; --surface:#161917; --raised:#1f2321; --paper:#f0e5c8; --white:#f4ecd6; --muted:#a6ada7;
          --faint:#8a9189; --green:#00d684; --greenfield:#0d2a1e; --red:#ff4a3d; --redfield:#34140f; --amber:#ffc36d;
          --blue:#7fb6ff; --on:#0b0d0c; --well:rgba(11,13,12,.55); --scrim:rgba(11,13,12,.86); --scrim-solid:rgba(11,13,12,.98);
          --scrim-clear:rgba(11,13,12,0); --grid:rgba(244,236,214,.12); --glow:rgba(0,214,132,.55); --glow-dim:rgba(0,214,132,.15); }
  /* Cream: the brand's paper as the ground, ink type; for bright rooms and projectors. */
  :root[data-theme="cream"] { --ink:#efe4c6; --surface:#e3d6b1; --raised:#d7c79c; --paper:#141716; --white:#0b0d0c; --muted:#4c534d;
          --faint:#656c66; --green:#00784c; --greenfield:#cfe1c9; --red:#c3261b; --redfield:#f0cfc3; --amber:#8f5300; --blue:#1f5fae;
          --well:rgba(20,23,22,.08); --scrim:rgba(239,228,198,.92); --scrim-solid:rgba(239,228,198,.99); --scrim-clear:rgba(239,228,198,0);
          --grid:rgba(20,23,22,.14); --glow:rgba(0,120,76,.6); --glow-dim:rgba(0,120,76,.18); }
  /* Pub: pure black and white with saturated accents, readable from the back of the room. */
  :root[data-theme="pub"] { --ink:#000; --surface:#0e0e0e; --raised:#1c1c1c; --paper:#fff; --white:#fff; --muted:#d6d6d6; --faint:#bdbdbd;
          --green:#2bff9e; --greenfield:#00331f; --red:#ff4136; --redfield:#3d0400; --amber:#ffd60a; --blue:#8cc8ff;
          --well:rgba(255,255,255,.1); --scrim:rgba(0,0,0,.9); --scrim-solid:#000; --scrim-clear:rgba(0,0,0,0);
          --grid:rgba(255,255,255,.22); --glow:rgba(43,255,158,.75); --glow-dim:rgba(43,255,158,.2); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--ink); color:var(--white); overflow:hidden;
    font-family: "Roboto", "Segoe UI", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing:antialiased; }
  .num { font-family: "Roboto", "Arial Black", Arial, sans-serif; font-weight:900; letter-spacing:-0.04em; font-variant-numeric:tabular-nums; line-height:.9; }
  #app { position:absolute; inset:0; display:flex; flex-direction:column; padding:2.4vh 2.6vw; gap:2vh; }
  header { display:flex; align-items:baseline; gap:2vw; }
  header .title { font-size:3.4vh; font-weight:800; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .context { font-size:2.6vh; color:var(--green); font-weight:700; white-space:nowrap; }
  footer { display:flex; align-items:center; gap:1.4vw; color:var(--faint); font-size:1.8vh; }
  footer .mark { font-weight:900; color:var(--muted); letter-spacing:-0.02em; font-size:2.2vh; display:flex; align-items:center; gap:.7vw; }
  footer .mark svg { height:3vh; width:auto; }
  /* The Still Point mark on the dark ground: cream rings and dart, the brand green and red. */
  .sp-mark { --mk-ink:var(--paper); --mk-ground:var(--ink); --mk-green:#0a9d68; --mk-red:#e5352b; overflow:visible; }
  footer .dot { width:1vh; height:1vh; border-radius:50%; background:var(--green); }
  footer .dot.off { background:var(--amber); }
  footer .grow { flex:1; }
  footer .snd { color:var(--amber); font-weight:700; }
  main { flex:1; display:flex; gap:2vw; min-height:0; }

  /* Match: one panel per player */
  .panel { flex:1; border-radius:3vh; background:var(--surface); padding:3.2vh 2.6vw; display:flex; flex-direction:column; gap:1.6vh; min-width:0; transition: background .3s; }
  .panel.active { background:var(--greenfield); }
  .panel.bust { background:var(--redfield); }
  .who { display:flex; align-items:center; gap:1.2vw; }
  .avatar { width:6vh; height:6vh; border-radius:50%; background:var(--paper); color:var(--ink); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:3.2vh; flex:none; }
  .panel.active .avatar { background:var(--green); }
  .name { font-size:4.6vh; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
  .badge { font-size:2.4vh; color:var(--muted); font-weight:700; white-space:nowrap; }
  .panel.active .badge.throwing { color:var(--green); }
  .score { font-size:36vh; color:var(--white); }
  .many .score { font-size:16vh; }
  .facts { display:flex; gap:2vw; font-size:3.2vh; color:var(--muted); flex-wrap:wrap; }
  .facts b { color:var(--white); font-weight:800; }
  .darts { display:flex; gap:1vw; margin-top:auto; }
  .dart { flex:1; height:9vh; border-radius:1.6vh; background:var(--well); display:flex; align-items:center; justify-content:center; font-size:4vh; font-weight:900; color:var(--white); }
  .dart.empty { color:var(--muted); font-size:2.8vh; font-weight:700; }
  .dart.next { box-shadow: inset 0 0 0 .35vh var(--glow); animation: nextDart 1.6s ease-in-out infinite; }
  @keyframes nextDart { 50% { box-shadow: inset 0 0 0 .35vh var(--glow-dim); } }
  .checkout { font-size:5.6vh; color:var(--green); font-weight:900; letter-spacing:-0.02em; }
  .checkout small { display:block; font-size:2.6vh; color:var(--muted); font-weight:700; letter-spacing:0; margin-bottom:.4vh; }
  .last { font-size:3.2vh; color:var(--muted); }
  /* The visit on a drawn board: the beds the darts landed in, numbered in throw order. */
  .foot { display:flex; gap:1.6vw; align-items:flex-end; margin-top:auto; min-height:0; }
  .foot .stack { flex:1; min-width:0; display:flex; flex-direction:column; gap:1.6vh; }
  .board { width:30vh; height:30vh; flex:none; overflow:visible; }
  .board .w0 { fill:#101311; } .board .w1 { fill:#323834; }
  .board .rr { fill:#6b231c; } .board .rg { fill:#1a5a3e; }
  .board .lit { fill:var(--green); }
  .panel.bust .board .lit { fill:var(--red); }
  .board .pin circle { fill:var(--ink); stroke:var(--white); stroke-width:4; }
  .board .pin text { fill:var(--white); font-size:24px; font-weight:900; text-anchor:middle; dominant-baseline:central; }
  .board .pin.spot text { font-size:19px; }
  .thrower { font-size:3.2vh; color:var(--muted); font-weight:700; margin-top:-.4vh; } .thrower b { color:var(--white); }
  .panel.active .thrower b { color:var(--green); }
  .board .pin.spot circle.tip { fill:var(--white); stroke:var(--ink); stroke-width:3; }
  .board .nums text { fill:var(--muted); font-size:26px; font-weight:800; text-anchor:middle; dominant-baseline:central; }
  /* Lines over a leg or a match: who led, and when it turned. */
  .chart { display:block; overflow:visible; }
  .chart .grid { stroke:var(--grid); stroke-width:2; }
  .chart .axis { fill:var(--faint); font-size:20px; font-weight:700; }
  .chart .ln { fill:none; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
  .chart .ln.p0 { stroke:var(--green); } .chart .ln.p1 { stroke:var(--paper); } .chart .ln.p2 { stroke:var(--amber); } .chart .ln.p3 { stroke:var(--blue); }
  .chart .end { font-size:24px; font-weight:800; dominant-baseline:central; }
  .chart .end.p0 { fill:var(--green); } .chart .end.p1 { fill:var(--paper); } .chart .end.p2 { fill:var(--amber); } .chart .end.p3 { fill:var(--blue); }
  .chart .dot.p0 { fill:var(--green); } .chart .dot.p1 { fill:var(--paper); } .chart .dot.p2 { fill:var(--amber); } .chart .dot.p3 { fill:var(--blue); }
  .result .chart { height:30vh; width:auto; max-width:76vw; margin-top:1vh; }
  .result.charted { gap:1.4vh; }
  .result.charted .headline { font-size:12vh; }
  .result.charted .cards { margin-top:1vh; }
  .result.charted .card { padding:2vh 2.4vw; }
  .result.charted .card .av { font-size:8vh; }
  .result .cap { font-size:2.4vh; color:var(--muted); font-weight:700; margin-top:1vh; }
  .rows { flex:1; display:flex; flex-direction:column; gap:1.4vh; }
  .row { flex:1; display:flex; align-items:center; gap:1.6vw; border-radius:2vh; background:var(--surface); padding:1.6vh 2vw; max-height:22vh; }
  .row .badge { font-size:3vh; }
  .row.active { background:var(--greenfield); }
  .row .name { font-size:4vh; }
  .row .score { font-size:12vh; }
  .row .mid { flex:1; min-width:0; display:flex; flex-direction:column; gap:.8vh; }
  .row .line { display:flex; align-items:center; gap:.8vw; min-width:0; }
  .row .chip { font-size:3vh; font-weight:900; background:var(--well); border-radius:1vh; padding:.6vh .9vw; }
  .row .co { font-size:3vh; font-weight:900; color:var(--green); white-space:nowrap; margin-left:.6vw; }
  .row.bust { background:var(--redfield); }
  .row .bustword { font-size:3vh; font-weight:900; color:var(--red); }
  .row .avgp { display:none; font-size:2.6vh; color:var(--muted); font-weight:700; }
  /* A tall screen keeps every name: the average moves under it. */
  @media (orientation: portrait) { .row > .badge { display:none; } .row .avgp { display:block; } .row .score { font-size:10vh; } .row .name { font-size:3.6vh; } }
  .result { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2vh; text-align:center; }
  .result .headline { font-size:18vh; font-weight:900; letter-spacing:-0.04em; color:var(--paper); }
  .result .sub { font-size:3vh; color:var(--muted); }
  .result .cards { display:flex; gap:2vw; margin-top:3vh; }
  .result .card { background:var(--surface); border-radius:2.4vh; padding:3vh 3vw; min-width:24vw; text-align:left; }
  .result .card.win { background:var(--greenfield); }
  .result .card .nm { font-size:4.4vh; font-weight:800; }
  .result .card .av { font-size:10vh; }
  .result .card .lg { font-size:3vh; color:var(--muted); }
  .result .card .ks { display:flex; gap:1.6vw; margin-top:1.4vh; flex-wrap:wrap; }
  .result .card .ks div { display:flex; flex-direction:column; gap:.3vh; }
  .result .card .ks b { font-size:3.6vh; font-weight:900; font-variant-numeric:tabular-nums; }
  .result .card .ks span { font-size:2vh; color:var(--muted); font-weight:700; white-space:nowrap; }
  .result .card .prt { display:flex; flex-direction:column; gap:.4vh; margin-top:1.2vh; font-size:2.4vh; color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums; }
  .result .card .prt b { color:var(--white); font-weight:800; }
  .result.charted .card .ks { margin-top:.8vh; } .result.charted .card .ks b { font-size:3vh; }

  /* Tournament */
  /* Several boards live: every board gets its own panel; the strip below says what comes next. */
  .boards { flex:1; min-height:0; display:grid; gap:1.6vw; grid-template-columns:repeat(var(--cols), 1fr); grid-auto-rows:1fr; }
  .bpanel { background:var(--surface); border-radius:2.6vh; padding:2.2vh 1.8vw; display:flex; flex-direction:column; gap:1.2vh; min-width:0; min-height:0; overflow:hidden; }
  .bpanel.mine { box-shadow:inset 0 0 0 .35vh var(--glow-dim); }
  .bpanel .bh { display:flex; align-items:baseline; gap:1vw; }
  .bpanel .bn { font-size:calc(var(--bs) * .26); font-weight:900; color:var(--green); white-space:nowrap; }
  .bpanel .br { font-size:calc(var(--bs) * .17); color:var(--muted); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bpanel .bp { flex:1; min-height:0; display:flex; align-items:center; gap:1vw; border-radius:1.8vh; padding:0 1.2vw; }
  .bpanel .bp.on { background:var(--greenfield); }
  .bpanel .bp.bust { background:var(--redfield); }
  .bpanel .bp .who { flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; text-align:left; gap:.4vh; }
  .bpanel .bp .nm { font-size:calc(var(--bs) * .3); font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bpanel .bp .ln { font-size:calc(var(--bs) * .17); color:var(--muted); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bpanel .bp.on .ln b { color:var(--green); }
  .bpanel .bp .sc { font-size:var(--bs); font-weight:900; letter-spacing:-0.04em; line-height:1; font-variant-numeric:tabular-nums; }
  .bpanel .bp:not(.on) .sc { color:var(--muted); }
  .bstrip { display:flex; align-items:center; gap:2vw; font-size:2.6vh; color:var(--muted); font-weight:700; min-height:0; }
  .bstrip b { color:var(--white); }
  .bstrip .nx { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bstrip .follow { margin:0; }
  @media (orientation: portrait) { .boards { grid-template-columns:1fr; } }
  .heat { width:100%; height:100%; display:flex; flex-direction:column; gap:2vh; }
  .heat h2 { font-size:6vh; font-weight:900; letter-spacing:-0.03em; color:var(--paper); }
  .heat .sub { font-size:2.6vh; color:var(--muted); margin-top:-1.6vh; }
  .heat .hbs { flex:1; min-height:0; display:grid; gap:1.4vh 1.6vw; grid-template-columns:repeat(var(--hc), 1fr); grid-auto-rows:1fr; }
  .heat .hb { min-width:0; min-height:0; display:flex; align-items:center; gap:1.2vw; }
  .heat .hb .hw { display:flex; flex-direction:column; gap:.6vh; min-width:0; }
  .heat .hb svg { height:100%; width:auto; aspect-ratio:1; flex:none; }
  .heat .hb svg > :not(.hd) { opacity:.45; }
  .heat .hn { font-size:3.2vh; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .heat .hl { font-size:2.2vh; color:var(--muted); font-weight:700; }
  .heat .hd { fill:var(--paper); stroke:var(--ink); stroke-width:1.5; opacity:0; animation:heatIn .5s ease-out forwards; }
  @keyframes heatIn { from { opacity:0; transform:scale(2.4); } to { opacity:.85; transform:scale(1); } }
  .heat .hd { transform-box:fill-box; transform-origin:center; }
  @media (prefers-reduced-motion: reduce) { .heat .hd { animation:none; opacity:.9; } }
  .side { width:34vw; display:flex; flex-direction:column; gap:1.4vh; min-width:0; min-height:0; overflow:hidden; }
  .side .nexts { display:flex; flex-direction:column; gap:1.4vh; }
  .side .nexts .more { font-size:2.4vh; color:var(--muted); font-weight:700; padding-left:1.2vw; }
  /* A long list of final places tightens instead of running into the footer. */
  .side.many .champion { padding:2.6vh 2.4vw; } .side.many .champion .cup { height:7vh; } .side.many .champion .n { font-size:7vh; }
  .side.many .pl { font-size:2.3vh; padding:.45vh 1.2vw; }
  .label { font-size:2.8vh; color:var(--muted); font-weight:800; text-transform:none; margin-top:.6vh; }
  .fix { border-radius:1.8vh; background:var(--surface); padding:1.6vh 1.6vw; display:flex; align-items:center; gap:1vw; }
  .fix.live { background:var(--greenfield); }
  .fix .vs { flex:1; min-width:0; }
  .fix .vs div:first-child { font-size:3.6vh; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fix .vs div:last-child { font-size:2.6vh; color:var(--muted); }
  .fix .bd { font-size:2.4vh; color:var(--green); font-weight:900; white-space:nowrap; }
  .stage { flex:1; min-width:0; position:relative; overflow:hidden; }
  .champion { border-radius:3vh; background:var(--paper); color:var(--ink); padding:4vh 3vw; display:flex; flex-direction:column; gap:1vh; }
  .champion .cup { height:12vh; width:auto; align-self:flex-start; margin-bottom:.6vh; }
  .champion .k { font-size:2.6vh; font-weight:800; opacity:.6; }
  .champion .n { font-size:9vh; font-weight:900; letter-spacing:-0.04em; line-height:.95; }
  .champion .p { font-size:2.6vh; opacity:.75; }
  table { width:100%; border-collapse:separate; border-spacing:0 .8vh; font-size:var(--table, 3.2vh); }
  th { text-align:left; color:var(--muted); font-size:2.6vh; font-weight:800; padding:0 1vw; }
  td { background:var(--surface); padding:1.3vh 1vw; }
  td:first-child { border-radius:1.4vh 0 0 1.4vh; color:var(--muted); width:4vw; }
  td:last-child { border-radius:0 1.4vh 1.4vh 0; font-weight:900; color:var(--paper); }
  tr.through td:first-child { box-shadow: inset .5vw 0 0 var(--green); }
  .tables { display:grid; grid-template-columns:repeat(auto-fit, minmax(28vw, 1fr)); gap:2vw; }
  .tables h3 { font-size:3.2vh; margin-bottom:.4vh; }
  /* Portrait screens (a turned TV, a tablet): stack instead of squeezing columns. */
  @media (orientation: portrait) {
    main { flex-direction:column; }
    .side { width:auto; max-height:46vh; flex:none; }
    .champion { padding:2.4vh 4vw; } .champion .cup { height:6vh; } .champion .n { font-size:6vh; }
    .stage { min-height:40vh; }
    .panel { padding:2vh 4vw; gap:1vh; }
    .panel .score { font-size:13vh; }
    .panel .darts .dart { height:6vh; }
    .board { width:12vh; height:12vh; }
    .result.charted .headline { font-size:15vw; }
    .result.charted .card .av { font-size:6vh; }
    .result.charted .card .lg { font-size:2vh; }
    .result .chart, #leg .chart { width:92vw; height:auto; max-width:none; }
    header .title { white-space:normal; font-size:2.8vh; }
    .name { font-size:3.6vh; }
    /* A tall screen between matches gives the whole height to the Order of Merit. */
    .idle-side { display:none; }
    .mrow .ev { display:none; }
  }
  svg text { font-family: "Roboto", "Segoe UI", Arial, sans-serif; }

  .lb { display:flex; gap:1.2vw; overflow:hidden; margin-top:.6vh; }
  .lbcol { display:flex; flex-direction:column; gap:.8vh; min-width:0; flex:1; }
  .lbt { font-size:1.9vh; color:var(--muted); font-weight:800; }
  .mini { background:var(--surface); border-radius:1.2vh; padding:.7vh .8vw; font-size:2vh; }
  .mini.live { background:var(--greenfield); box-shadow: inset 0 0 0 2px var(--green); }
  .mini.bye { opacity:.4; }
  .ml { display:flex; justify-content:space-between; gap:.6vw; color:var(--white); }
  .ml span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ml.w { font-weight:800; } .ml.w b { color:var(--green); }
  .ml.x { color:var(--muted); }
  /* Order of Merit and final places */
  .merit { display:flex; flex-direction:column; gap:1vh; height:100%; overflow:hidden; }
  .merit h2 { font-size:4.6vh; font-weight:900; letter-spacing:-0.03em; color:var(--paper); }
  .merit .sub { font-size:2.4vh; color:var(--muted); margin-bottom:.6vh; }
  .mrow { display:flex; align-items:center; gap:1.4vw; background:var(--surface); border-radius:1.6vh; padding:1vh 1.4vw; font-size:var(--mrow, 3.2vh); }
  .mrow .rk { width:3.6vw; font-weight:900; color:var(--muted); flex:none; }
  .mrow .nm { flex:1; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .mrow .ev { font-size:.62em; color:var(--muted); white-space:nowrap; }
  .mrow .pt { font-weight:900; color:var(--paper); min-width:5vw; text-align:right; }
  .form { display:flex; gap:.4vw; }
  .form i { font-style:normal; min-width:2.8vh; height:2.8vh; border-radius:.8vh; background:var(--raised); font-size:1.7vh; font-weight:900; color:var(--muted);
    display:flex; align-items:center; justify-content:center; padding:0 .4vw; }
  .gold { color:#e0b341 !important; } .silver { color:#b9c0c7 !important; } .bronze { color:#b07a4f !important; }
  .form i.gold { background:#e0b341; color:var(--on) !important; } .form i.silver { background:#b9c0c7; color:var(--on) !important; } .form i.bronze { background:#b07a4f; color:var(--on) !important; }
  .pl { display:flex; align-items:center; gap:1vw; font-size:2.6vh; padding:.7vh 1.2vw; background:var(--surface); border-radius:1.2vh; }
  .pl .rk { width:2.6vw; font-weight:900; color:var(--muted); } .pl .nm { flex:1; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pl .lb2 { color:var(--muted); font-size:2.1vh; white-space:nowrap; }
  /* Between matches: an attract loop that never holds one picture for long (no burn-in). */
  .attract { flex:1; position:relative; min-height:0; animation: drift 84s ease-in-out infinite alternate; }
  .slide { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:5vw; animation: slideIn .9s ease-out both; }
  .slide .brandmark { height:58vh; width:auto; flex:none; }
  .slide .brandmark .ring { transform-origin:618px 648px; animation: breathe 7s ease-in-out infinite; }
  .slide .copy { display:flex; flex-direction:column; gap:2.6vh; max-width:46vw; }
  .slide .copy .word { font-size:17vh; font-weight:900; letter-spacing:-0.05em; color:var(--paper); line-height:.85; text-align:left; }
  .slide .copy .hint { font-size:3.4vh; color:var(--muted); text-align:left; }
  .slide.steps { flex-direction:column; gap:4vh; }
  .slide.steps h2 { font-size:7vh; font-weight:900; letter-spacing:-0.03em; color:var(--paper); }
  .slide.steps ol { list-style:none; display:flex; gap:2.4vw; counter-reset:step; }
  .slide.steps li { counter-increment:step; width:24vw; background:var(--surface); border-radius:2.4vh; padding:3.4vh 2vw; font-size:3.2vh; color:var(--muted); line-height:1.3; }
  .slide.steps li::before { content:counter(step); display:block; font-size:9vh; font-weight:900; color:var(--green); line-height:1; margin-bottom:1.6vh; }
  .slide.steps li b { color:var(--white); }
  .slide.tonight { flex-direction:column; gap:4vh; }
  .slide.tonight h2 { font-size:7vh; font-weight:900; letter-spacing:-0.03em; color:var(--paper); }
  .slide.tonight .sub { font-size:2.8vh; color:var(--muted); margin-top:-3vh; }
  .slide.tonight .highs { display:flex; gap:2.4vw; }
  .slide.tonight .hi { width:19vw; background:var(--surface); border-radius:2.4vh; padding:3.4vh 2vw; display:flex; flex-direction:column; gap:1.2vh; }
  .slide.tonight .hi .l { font-size:2.4vh; line-height:1.25; min-height:2.5em; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-weight:700; }
  .slide.tonight .hi .v { font-size:min(11vh, 4.6vw); font-weight:900; color:var(--green); line-height:1; letter-spacing:-0.03em; }
  .slide.tonight .hi .v small { font-size:3vh; color:var(--muted); font-weight:700; letter-spacing:0; margin-left:.6vw; }
  .slide.tonight .hi .n { font-size:3.6vh; color:var(--white); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Inside a finished tournament's stage the highs sit two by two beside the champion. */
  .staged { position:relative; height:100%; }
  .staged .slide.tonight { gap:3vh; }
  .staged .slide.tonight .highs { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:2vh 2vw; width:min(100%, 56vw); }
  .staged .slide.tonight .hi { width:auto; padding:2.6vh 2vw; }
  .staged .slide.tonight .hi .l { min-height:0; }
  .slide.board-merit { padding:0 6vw; }
  .slide.board-merit .merit { width:100%; }
  .dots { position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:center; gap:.8vw; }
  .dots i { width:1vh; height:1vh; border-radius:50%; background:var(--raised); }
  .dots i.on { background:var(--green); }
  @keyframes drift { 0% { transform:translate(-1.2vw,-1.4vh); } 100% { transform:translate(1.2vw,1.4vh); } }
  @keyframes slideIn { from { opacity:0; transform:translateY(2vh); } }
  @keyframes breathe { 50% { transform:scale(1.025); } }
  #confetti { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  @media (orientation: portrait) {
    .slide { flex-direction:column; gap:3vh; }
    .slide .brandmark { height:auto; width:60vw; }
    .slide .copy { max-width:86vw; align-items:center; }
    .slide .copy .word, .slide .copy .hint { text-align:center; }
    .slide.steps { gap:2.4vh; }
    .slide.steps h2 { font-size:8vw; text-align:center; }
    .slide.steps ol { flex-direction:column; gap:1.6vh; }
    .slide.steps li { width:84vw; font-size:4.2vw; padding:2.2vh 5vw; }
    .slide.steps li::before { font-size:9vw; margin-bottom:.8vh; }
    .slide .copy .word { font-size:22vw; }
    .slide.tonight h2 { font-size:9vw; }
    .slide.tonight .sub { font-size:3.6vw; margin-top:-2vh; }
    .slide.tonight .highs { flex-wrap:wrap; justify-content:center; gap:2vh 4vw; width:88vw; }
    .slide.tonight .hi { width:42vw; padding:2.4vh 4vw; }
    .slide.tonight .hi .l { font-size:3vw; }
    .slide.tonight .hi .v { font-size:10vw; }
    .slide.tonight .hi .v small { font-size:3.6vw; }
    .slide.tonight .hi .n { font-size:4.6vw; }
  }
  @media (prefers-reduced-motion: reduce) { .attract, .slide .brandmark .ring, .dart.next { animation:none; } }
  /* Idle and moments */
  .idle { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3vh; text-align:center; }
  .idle .word { font-size:26vh; font-weight:900; letter-spacing:-0.05em; color:var(--paper); line-height:.85; }
  .idle .hint { font-size:3.4vh; color:var(--muted); max-width:60vw; }
  #moment { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--scrim);
    opacity:0; pointer-events:none; transition:opacity .25s; }
  #moment.show { opacity:1; }
  #moment .big { font-size:40vh; color:var(--green); transform:scale(.8); transition:transform .35s cubic-bezier(.2,1.4,.4,1); }
  #moment.show .big { transform:scale(1); }
  #moment #momentWho { font-size:6vh; font-weight:800; color:var(--white); }
  /* A match call: the desk sends a match to a board and the room reads it from across the bar. */
  #call { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.4vh; text-align:center;
    background:var(--ink); opacity:0; pointer-events:none; transition:opacity .35s; padding:0 6vw; }
  #call.show { opacity:1; }
  #call .k { font-size:3.4vh; font-weight:800; color:var(--muted); letter-spacing:.02em; }
  #call .b { font-size:22vh; font-weight:900; color:var(--green); letter-spacing:-0.04em; line-height:.9; transform:translateY(2vh); transition:transform .5s cubic-bezier(.2,1.2,.4,1); }
  #call.show .b { transform:none; }
  #call .vs { display:flex; align-items:baseline; justify-content:center; gap:3vw; width:100%; }
  #call .vs .n { font-size:9vh; font-weight:900; color:var(--paper); letter-spacing:-0.03em; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #call .vs .n:first-child { text-align:right; } #call .vs .n:last-child { text-align:left; }
  #call .vs .v { font-size:4vh; font-weight:800; color:var(--muted); }
  #call .r { font-size:4vh; font-weight:800; color:var(--white); }
  /* Walk-on: who each player is in this club, read from the Order of Merit and this event's results. */
  #call .intro { display:flex; gap:3vw; width:100%; align-items:flex-start; margin-top:-1vh; }
  #call .intro .sp { flex:none; width:2.4vh; }
  #call .intro .nm { display:none; }
  #call .intro > div:not(.sp) { flex:1; min-width:0; display:flex; flex-direction:column; gap:1vh; font-size:3vh; color:var(--muted); font-weight:700; }
  #call .intro > div:first-child { align-items:flex-end; text-align:right; } #call .intro > div:last-child { align-items:flex-start; text-align:left; }
  #call .intro b { color:var(--paper); font-weight:900; }
  #call .intro .road { font-size:2.6vh; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  #call .intro:empty { display:none; }
  /* A leg just won: who took it, in how many darts, with what out. */
  #leg { position:absolute; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; gap:1.4vh; padding:4vh 6vw 6vh;
    background:linear-gradient(to top, var(--scrim-solid) 84%, var(--scrim-clear)); padding-top:7vh; transform:translateY(100%); transition:transform .45s cubic-bezier(.2,1,.4,1); pointer-events:none; }
  #leg.show { transform:none; }
  #leg .k { font-size:3vh; font-weight:800; color:var(--muted); }
  #leg .w { font-size:10vh; font-weight:900; color:var(--paper); letter-spacing:-0.03em; line-height:1; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #leg .f { font-size:4.4vh; font-weight:900; color:var(--green); }
  #leg .a { font-size:2.8vh; color:var(--muted); }
  #leg .chart { height:17vh; width:auto; max-width:70vw; margin-top:1vh; }
  @media (orientation: portrait) { #leg .w { font-size:11vw; } #leg .f { font-size:6vw; } #call .b { font-size:17vw; } #call .vs { flex-direction:column; align-items:center; gap:1vh; } #call .vs .n { text-align:center !important; font-size:7vh; }
    #call .intro { flex-direction:column; align-items:center; gap:2vh; margin-top:0; } #call .intro .sp { display:none; }
    #call .intro > div:not(.sp) { align-items:center !important; text-align:center !important; font-size:2.4vh; }
    #call .intro .nm { display:block; color:var(--paper); font-weight:900; } }

  /* Follow on your phone: the code on the TV for anyone in the room. */
  .follow { display:flex; align-items:center; gap:1.4vw; margin-top:auto; padding-top:1.4vh; }
  .follow img { width:12vh; height:12vh; border-radius:1.2vh; flex:none; }
  .follow div { font-size:2.3vh; color:var(--muted); line-height:1.3; }
  .follow div b { display:block; color:var(--white); font-size:2.8vh; font-weight:800; }
  .slide.steps .follow { margin-top:0; }
  @media (orientation: portrait) { .follow img { width:9vh; height:9vh; } }

  /* Pocket: the same live view on a spectator's phone, read with one hand and scrolled. */
  html.pocket, html.pocket body { overflow:auto; height:auto; min-height:100%; }
  html.pocket #app { position:static; display:block; padding:0 16px calc(24px + env(safe-area-inset-bottom)); min-height:100vh; }
  html.pocket #moment, html.pocket #call, html.pocket #leg { position:fixed; z-index:30; }
  html.pocket #confetti { position:fixed; z-index:31; }
  html.pocket #moment .big { font-size:34vw; } html.pocket #moment #momentWho { font-size:7vw; }
  html.pocket #call { padding:0 20px; } html.pocket #call .b { font-size:20vw; } html.pocket #call .k, html.pocket #call .r { font-size:5vw; }
  html.pocket #call .vs { flex-direction:column; align-items:center; gap:6px; } html.pocket #call .vs .n { text-align:center !important; font-size:9vw; }
  html.pocket #call .intro { display:none; }
  html.pocket #leg { padding:32px 16px 40px; } html.pocket #leg .w { font-size:10vw; } html.pocket #leg .f { font-size:6vw; }
  html.pocket #leg .k, html.pocket #leg .a { font-size:4vw; } html.pocket #leg .chart { height:auto; width:100%; max-width:none; }
  .ptop { position:sticky; top:0; z-index:5; background:var(--ink); display:flex; align-items:center; gap:10px; padding:14px 0 12px; }
  .ptop .mark { display:flex; align-items:center; gap:8px; font-weight:900; font-size:17px; letter-spacing:-0.02em; }
  .ptop .mark svg { height:22px; width:auto; }
  .ptop .dot { width:8px; height:8px; border-radius:50%; background:var(--green); flex:none; }
  .ptop .dot.off { background:var(--amber); }
  .ptop .st { color:var(--muted); font-size:14px; }
  .ptop .grow { flex:1; }
  .mebtn { font:inherit; font-size:15px; font-weight:800; color:var(--ink); background:var(--paper); border:0; border-radius:999px; padding:0 16px; min-height:44px; max-width:50vw;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .mebtn.set { background:var(--green); color:var(--on); }
  .pnow { border-radius:20px; background:var(--surface); padding:18px; margin:4px 0 16px; }
  .pnow.go { background:var(--green); color:var(--on); }
  .pnow .k { font-size:14px; color:var(--muted); font-weight:700; }
  .pnow.go .k, .pnow.go .s { color:var(--on); opacity:.75; }
  .pnow .h { font-size:28px; font-weight:900; letter-spacing:-0.02em; line-height:1.1; margin-top:4px; overflow-wrap:anywhere; }
  .pnow .s { font-size:16px; color:var(--muted); margin-top:6px; }
  .ptitle { font-size:30px; font-weight:900; letter-spacing:-0.03em; line-height:1.05; margin:8px 0 4px; color:var(--paper); overflow-wrap:anywhere; }
  .psub { font-size:16px; color:var(--muted); margin-bottom:16px; line-height:1.4; }
  .tabs { display:flex; gap:4px; background:var(--surface); border-radius:999px; padding:4px; margin-bottom:8px; position:sticky; top:70px; z-index:4; }
  .tabs button { flex:1; font:inherit; font-size:15px; font-weight:800; color:var(--muted); background:none; border:0; border-radius:999px; min-height:44px; cursor:pointer; }
  .tabs button.on { background:var(--paper); color:var(--ink); }
  .ph { font-size:20px; font-weight:900; margin:22px 0 10px; letter-spacing:-0.01em; }
  .pfix { display:flex; align-items:center; gap:12px; background:var(--surface); border-radius:16px; padding:14px 16px; margin-bottom:8px; }
  .pfix.live { background:var(--greenfield); }
  .pfix.me, .prow.me, .pcard.me { box-shadow: inset 4px 0 0 var(--paper); }
  .pfix .vs { flex:1; min-width:0; }
  .pfix .vs div:first-child { font-size:18px; font-weight:800; overflow-wrap:anywhere; }
  .pfix .vs div:last-child { font-size:14px; color:var(--muted); margin-top:2px; }
  .pfix .bd { font-size:15px; font-weight:900; color:var(--green); white-space:nowrap; text-align:right; }
  .pfix .bd small { display:block; color:var(--white); font-size:15px; }
  .pgrid { display:grid; grid-template-columns:1fr; gap:8px; }
  @media (min-width:520px) { .pgrid { grid-template-columns:1fr 1fr; } }
  .pcard { background:var(--surface); border-radius:14px; padding:10px 14px; }
  .pcard.live { background:var(--greenfield); }
  .pcard.bye { opacity:.45; }
  .pcard .ml { font-size:16px; padding:3px 0; }
  .prow { display:flex; align-items:center; gap:12px; background:var(--surface); border-radius:14px; padding:12px 14px; margin-bottom:6px; font-size:16px; }
  .prow.through .rk { color:var(--green); }
  .prow .rk { width:26px; font-weight:900; color:var(--muted); flex:none; }
  .prow .nm { flex:1; font-weight:800; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prow .ex { color:var(--muted); font-size:14px; white-space:nowrap; }
  .prow .pt { font-weight:900; color:var(--paper); min-width:34px; text-align:right; font-variant-numeric:tabular-nums; }
  .pplayer { border-radius:20px; background:var(--surface); padding:16px 18px; margin-bottom:10px; }
  .pplayer.active { background:var(--greenfield); }
  .pplayer.bust { background:var(--redfield); }
  .pplayer .top { display:flex; align-items:center; gap:10px; }
  .pplayer .nm { flex:1; font-size:20px; font-weight:800; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pplayer .tl { font-size:15px; color:var(--muted); font-weight:700; white-space:nowrap; }
  .pplayer.active .tl { color:var(--green); } .pplayer.bust .tl { color:var(--red); }
  .pplayer .sc { font-size:72px; margin-top:8px; }
  .pplayer .co { font-size:22px; font-weight:900; color:var(--green); margin-top:8px; }
  .pplayer .ds { display:flex; gap:6px; margin-top:12px; }
  .pplayer .ds div { flex:1; height:44px; border-radius:12px; background:var(--well); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:900; }
  .pplayer .ls { font-size:16px; color:var(--muted); margin-top:8px; }
  .pplayer .ls b { color:var(--white); }
  .pboard { display:flex; justify-content:center; margin:6px 0 12px; }
  .pboard .board { width:min(100%, 340px); height:auto; aspect-ratio:1; }
  .pcmp { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:baseline; background:var(--surface); border-radius:14px; padding:10px 14px; margin-bottom:6px; }
  .pcmp.head { background:none; padding-top:0; padding-bottom:0; }
  .pcmp b { font-size:20px; font-weight:900; color:var(--muted); font-variant-numeric:tabular-nums; } .pcmp b.lead { color:var(--white); }
  .pcmp b:last-child { text-align:right; } .pcmp span { font-size:14px; color:var(--muted); font-weight:700; text-align:center; }
  .pempty { font-size:17px; color:var(--muted); padding:24px 0; line-height:1.5; }
  #sheet { position:fixed; inset:0; background:var(--scrim); display:none; flex-direction:column; padding:16px; z-index:40; overflow:auto; }
  #sheet.show { display:flex; }
  #sheet h2 { font-size:24px; font-weight:900; margin:8px 0 4px; }
  #sheet p { color:var(--muted); font-size:15px; margin-bottom:14px; line-height:1.4; }
  #sheet button { font:inherit; text-align:left; font-size:18px; font-weight:800; color:var(--white); background:var(--surface); border:0; border-radius:14px; padding:12px 16px; margin-bottom:6px; min-height:48px; cursor:pointer; }
  #sheet button.on { background:var(--green); color:var(--on); }
  #sheet button.quiet { background:none; color:var(--muted); text-align:center; }
  button:focus-visible { outline:3px solid var(--green); outline-offset:2px; }

  /* Cricket: the marks board, one column per player around the numbers, as it is chalked. */
  .ck { flex:1; display:grid; gap:1vh 1.6vw; align-content:stretch; min-height:0; }
  .ck .hd { border-radius:2.4vh; background:var(--surface); padding:2vh 1.6vw; display:flex; flex-direction:column; align-items:center; gap:.6vh; min-width:0; }
  .ck .hd.active { background:var(--greenfield); }
  .ck .hd .nm { font-size:4vh; font-weight:800; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ck .hd .pts { font-size:12vh; }
  .ck .hd .ds { display:flex; gap:.6vw; min-height:4.4vh; }
  .ck .hd .ds span { font-size:2.8vh; font-weight:900; background:var(--well); border-radius:1vh; padding:.6vh .9vw; }
  .ck .tg { display:flex; align-items:center; justify-content:center; font-size:6vh; color:var(--paper); }
  .ck .tg.dead { color:var(--raised); }
  .ck .mk { display:flex; align-items:center; justify-content:center; border-radius:1.6vh; background:var(--surface); min-height:0; }
  .ck .mk.dead { background:transparent; }
  .ck .mk svg { height:6.4vh; width:6.4vh; overflow:visible; }
  .ck .mk svg * { stroke:var(--muted); stroke-width:11; stroke-linecap:round; fill:none; }
  .ck .mk.open svg * { stroke:var(--green); }
  .ck .mk.dead svg * { stroke:var(--raised); }
  html.pocket .ck { gap:6px 8px; margin-bottom:16px; }
  html.pocket .ck .hd { border-radius:16px; padding:12px 8px; gap:4px; }
  html.pocket .ck .hd .nm { font-size:16px; } html.pocket .ck .hd .pts { font-size:40px; }
  html.pocket .ck .hd .ds { min-height:28px; gap:4px; } html.pocket .ck .hd .ds span { font-size:14px; padding:4px 6px; border-radius:8px; }
  html.pocket .ck .tg { font-size:24px; } html.pocket .ck .mk { border-radius:10px; height:44px; }
  html.pocket .ck .mk svg { height:26px; width:26px; }

  /* The night's story: how the champion got there, and the match everyone will talk about. */
  .story { height:100%; display:flex; flex-direction:column; justify-content:center; gap:2.2vh; padding:0 2vw; }
  .story h2 { font-size:5.4vh; font-weight:900; letter-spacing:-0.03em; color:var(--paper); }
  .story .road { display:flex; flex-direction:column; gap:1vh; }
  .story .step { display:grid; grid-template-columns:16vw 1fr auto; align-items:center; gap:1.4vw; background:var(--surface); border-radius:1.6vh; padding:1.3vh 1.6vw; font-size:3.2vh; }
  .story .step .rd { color:var(--muted); font-weight:700; font-size:2.5vh; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .story .step .op { font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .story .step .sc { font-weight:900; color:var(--green); font-variant-numeric:tabular-nums; }
  .story .step.lost .sc { color:var(--red); }
  .story .facts { display:grid; grid-template-columns:repeat(3, 1fr); gap:1.4vw; margin-top:1vh; }
  .story .facts div { background:var(--greenfield); border-radius:1.6vh; padding:1.6vh 1.4vw; display:flex; flex-direction:column; gap:.6vh; min-width:0; }
  .story .facts b { font-size:5vh; font-weight:900; letter-spacing:-0.03em; color:var(--white); line-height:1; }
  .story .facts span { font-size:2.2vh; color:var(--muted); font-weight:700; }
  .story .facts .close b { font-size:3.4vh; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  @media (orientation: portrait) {
    .story { gap:1.4vh; padding:0; } .story h2 { font-size:3.8vh; }
    .story .step { grid-template-columns:28vw 1fr auto; font-size:2.4vh; padding:1vh 3vw; } .story .step .rd { font-size:2vh; }
    .story .facts { grid-template-columns:1fr 1fr; } .story .facts .close { grid-column:1 / -1; } .story .facts b { font-size:3.4vh; }
    .side .champion, .side.many .champion { padding:2vh 4vw; gap:.4vh; } .side .champion .cup, .side.many .champion .cup { height:5vh; }
    .side .champion .n, .side.many .champion .n { font-size:5.5vh; } .side.many .pl { font-size:2vh; }
    .side .pl, .side .places-label { display:none; } .side { max-height:none; }
  }
  .pstory .step { display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; background:var(--surface); border-radius:14px; padding:12px 14px; margin-bottom:6px; font-size:16px; }
  .pstory .step .rd { color:var(--muted); font-size:14px; } .pstory .step .op { font-weight:800; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pstory .step .sc { font-weight:900; color:var(--green); } .pstory .step.lost .sc { color:var(--red); }
</style>

<div id="call" role="alert" aria-live="assertive"><div class="k" id="callKicker" data-t="Now on">Now on</div><div class="b num" id="callBoard">Board 1</div>
  <div class="vs"><div class="n" id="callHome"></div><div class="v">v</div><div class="n" id="callAway"></div></div><div class="intro" id="callIntro"></div><div class="r" id="callRound"></div></div>

<div id="sheet" role="dialog" aria-modal="true"></div>
<script>
(function () {
  var app = document.getElementById('app');
  var connected = false, state = null, lastTotals = null;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  /* Language: the phone sends "lang" with each state; ?lang= on the address wins. English is the default. */
  var NL = {
    'Tonight': 'Vanavond',
    '1 match played': '1 wedstrijd gespeeld',

    'Best average': 'Beste gemiddelde',
    'Highest checkout': 'Hoogste finish',
    'Most 180s': "Meeste 180's",
    'Best leg': 'Beste leg',
    'career average': 'carrièregemiddelde',
    'head to head {a}–{b}': 'onderling {a}–{b}',
    'Connecting to the phone…': 'Verbinden met de telefoon…',
    'Start a match or open a tournament on the phone. It appears here at once.': 'Start een wedstrijd of open een toernooi op de telefoon. Het verschijnt hier meteen.',
    'Demo': 'Demo', 'Live': 'Live', 'Reconnecting…': 'Opnieuw verbinden…',
    'Click or press OK for sound': 'Klik of druk op OK voor geluid',
    'Board {n}': 'Bord {n}', 'Now on': 'Nu op',
    '{name} wins': '{name} wint', '{name} win': '{name} winnen', 'Game complete': 'Spel afgelopen', 'Paused': 'Gepauzeerd',
    '3-dart average': '3-dart gemiddelde', '3-dart average through the match': '3-dart gemiddelde door de wedstrijd',
    'leg': 'leg', 'legs': 'legs', '{n} sets': '{n} sets',
    'Sets {n}': 'Sets {n}', 'Legs {n}': 'Legs {n}',
    'Bust': 'Bust', 'Throwing': 'Gooit', '{n} avg': '{n} gem.', 'Last {n}': 'Laatste {n}',
    'Checkout': 'Checkout', 'Target': 'Doel',
    'Third place': 'Derde plaats',
    'Player': 'Speler', 'P': 'G', 'W': 'W', 'Pts': 'Ptn',
    'Order of Merit': 'Order of Merit', 'Points from every finished tournament': 'Punten uit elk afgerond toernooi',
    '{n} played': '{n} gespeeld', 'title': 'titel', 'titles': 'titels',
    'Final places': 'Eindstand', 'Champion': 'Kampioen', 'Runner-up {name}': 'Tweede {name}', 'Third {name}': 'Derde {name}',
    'avg': 'gem.', 'Where the darts went': 'Waar de pijlen zaten', 'Every dart the camera scored tonight': 'Elke pijl die de camera vanavond telde', 'most in {bed}': 'meest in {bed}', '{n} boards playing': '{n} borden spelen', 'About {t} to go': 'Nog ongeveer {t}', 'On the boards': 'Op de borden', 'Up next': 'Hierna', '+{n} more': '+{n} meer', 'Waiting for results': 'Wachten op uitslagen',
