    'Run a tournament': 'Speel een toernooi', 'and this screen calls the matches and crowns the champion.': 'en dit scherm roept de wedstrijden om en kroont de kampioen.',
    '{n} out': '{n} uit',
    '{name} checked out': '{name} gooide uit',
    'Losers bracket': 'Verliezersschema', 'Grand final': 'Grote finale',
    'Beat {name}': 'Won van {name}', 'Lost to {name}': 'Verloren van {name}',
    'Set {n}': 'Set {n}', 'Leg {n}': 'Leg {n}', '{name} takes it': '{name} wint de leg', '{name} take it': '{name} winnen de leg', '{n} darts \u00b7 {c} out': '{n} pijlen \u00b7 {c} uit',
    'Final': 'Finale', 'Finals': 'Finales', 'Semi-final': 'Halve finale', 'Semi-finals': 'Halve finales',
    'Quarter-final': 'Kwartfinale', 'Quarter-finals': 'Kwartfinales', 'Round of {n}': 'Laatste {n}', 'Round {n}': 'Ronde {n}',
    'Group stage': 'Groepsfase', 'Knockout': 'Knock-out', 'Winner': 'Winnaar',
    'Follow on your phone': 'Volg op je telefoon', 'Scan for the bracket and your next match': 'Scan voor het schema en je volgende wedstrijd',
    'Follow a player': 'Volg een speler', 'Your matches are highlighted, and this phone tells you when you are called to a board.': 'Je wedstrijden worden gemarkeerd en deze telefoon laat weten wanneer je naar een bord wordt geroepen.',
    'Stop following {name}': 'Stop met {name} volgen', 'Close': 'Sluiten', 'No players yet.': 'Nog geen spelers.',
    'Playing now': 'Speelt nu', 'On {n}': 'Staat op {n}', 'On {n}, throwing': 'Staat op {n}, gooit nu', 'Your match is on': 'Je wedstrijd begint',
    'You are up next': 'Jij bent hierna', 'In the queue': 'In de rij', '{n} in line': '{n} in de rij', 'Final place': 'Eindplaats',
    '+{n} merit points': '+{n} meritpunten', 'Still in': 'Nog in het toernooi', 'Waiting for your next match': 'Wachten op je volgende wedstrijd',
    'Out': 'Uitgeschakeld', 'Following': 'Je volgt', 'No match for {name} tonight yet': 'Nog geen wedstrijd voor {name} vanavond',
    '{p} played \u00b7 {w} won': '{p} gespeeld \u00b7 {w} gewonnen', '{n} point': '{n} punt', '{n} points': '{n} punten',
    'Now': 'Nu', 'Bracket': 'Schema', 'Table': 'Stand', 'Merit': 'Ranking', 'Between matches': 'Tussen de wedstrijden',
    "The club's Order of Merit": 'De Order of Merit van de club',
    'Nothing is being played right now. This page updates by itself when a match or tournament starts on the phone.': 'Er wordt nu niet gespeeld. Deze pagina ververst vanzelf zodra er een wedstrijd of toernooi start op de telefoon.',
    'You are called to': 'Je wordt geroepen naar', 'v {name}': 'tegen {name}', 'last {n}': 'laatste {n}',
    'points': 'punten', 'marks': 'marks', 'Ended': 'Verlopen', 'This link has ended': 'Deze link is verlopen', 'The big screen was restarted on the phone. Scan the new code on the TV.': 'Het grote scherm is opnieuw gestart op de telefoon. Scan de nieuwe code op de tv.',
    'How {name} won it': 'Zo won {name}', 'Matches': 'Wedstrijden', 'Legs played': 'Legs gespeeld', 'Closest match': 'Spannendste wedstrijd',
    '{m} matches · {l} legs played': '{m} wedstrijden · {l} legs gespeeld',
    'Next': 'Hierna',
    'High out': 'Hoogste finish', '180s': "180's", 'First 9': 'Eerste 9'
  };
  var pinnedLang = (location.search.match(/[?&]lang=(\w+)/) || [])[1];
  var lang = 'en';
  /* tr(s, vars): the Dutch for s when the phone is in Dutch (else s), with {name} placeholders filled in. */
  function tr(s, vars) {
    var out = lang === 'nl' && NL.hasOwnProperty(s) ? NL[s] : s;
    if (vars) out = out.replace(/\{(\w+)\}/g, function (m, k) { return vars.hasOwnProperty(k) ? vars[k] : m; });
    return out;
  }
  /* Round names come from the phone in English; the usual ones are translated, anything else passes through. */
  function trRound(n) {
    n = String(n == null ? '' : n);
    var m = /^Round of (\d+)$/.exec(n) || /^Round (\d+)$/.exec(n);
    if (m) return tr(n.indexOf('of') > 0 ? 'Round of {n}' : 'Round {n}', { n: m[1] });
    return tr(n);
  }
  function applyStatic() {
    var els = document.querySelectorAll('[data-t]');
    for (var i = 0; i < els.length; i++) els[i].textContent = tr(els[i].getAttribute('data-t'));
    document.documentElement.setAttribute('lang', lang);
  }
  function setLang(name) {
    name = pinnedLang || name;
    var next = name === 'nl' ? 'nl' : 'en';
    if (next === lang) return;
    lang = next;
    applyStatic();
  }
  function initial(n) { n = String(n || '').trim(); return n ? esc(n.charAt(0).toUpperCase()) : '?'; }

  /* The Still Point mark (brand/logo_notext.png) as vector, so it is sharp on a 4K screen. */
  var markCount = 0;
  function mark(cls) {
    var id = 'spcut' + (++markCount);
    return '<svg class="sp-mark ' + (cls || '') + '" viewBox="190 150 945 930" aria-hidden="true">' +
      '<defs><mask id="' + id + '"><rect x="0" y="0" width="1254" height="1254" fill="#fff"/><rect x="828" y="0" width="426" height="452" fill="#000"/></mask></defs>' +
      '<g class="ring"><circle cx="618" cy="648" r="366" fill="none" stroke="var(--mk-ink)" stroke-width="110" mask="url(#' + id + ')"/>' +
      '<circle cx="617" cy="648" r="184" fill="none" stroke="var(--mk-green)" stroke-width="90"/>' +
      '<circle cx="617" cy="647" r="79" fill="var(--mk-red)"/></g>' +
      '<path d="M705 570 L900 378" stroke="var(--mk-ground)" stroke-width="104"/>' +
      '<path d="M628 645 L940 338" stroke="var(--mk-ink)" stroke-width="44" stroke-linecap="round"/>' +
      '<path fill="var(--mk-ink)" d="M864 400 V282 Q864 262 878 248 L958 170 Q975 156 995 162 Q1010 170 1011 188 V250 Q1010 262 1002 270 L940 335 Z"/>' +
      '<path fill="var(--mk-ink)" d="M876 415 H1003 Q1018 414 1028 404 L1110 322 Q1124 306 1118 288 Q1110 270 1092 268 H1030 Q1018 270 1010 278 L945 340 Z"/>' +
      '<path d="M948 332 L1012 266" stroke="var(--mk-ground)" stroke-width="9" stroke-linecap="round"/></svg>';
  }

  /* A drawn cup for the champion card, in the card's own ink. */
  var TROPHY = '<svg class="cup" viewBox="0 0 120 120" aria-hidden="true"><path fill="#c9962e" d="M30 14h60v26c0 20-12 34-30 36-18-2-30-16-30-36z"/>' +
    '<path fill="none" stroke="#c9962e" stroke-width="7" d="M31 24H16v8c0 12 8 20 18 21M89 24h15v8c0 12-8 20-18 21"/>' +
    '<path fill="#a87a1f" d="M53 75h14v17H53z"/><path fill="#0b0d0c" d="M36 92h48v14H36z"/><path fill="#f4ecd6" opacity=".35" d="M40 20h9v26c0 9 3 16 8 21-10-3-17-11-17-21z"/></svg>';

  var demo = /[?&]demo(&|$)/.test(location.search), casting = /[?&]cast(&|$)/.test(location.search);
  // A phone in the room gets the pocket layout; a TV, projector, turned screen or the website demo keeps the big one.
  var pocket = /[?&]pocket(&|$)/.test(location.search) || (!demo && !casting && !/[?&]tv(&|$)/.test(location.search) && Math.min(window.innerWidth, screen.width || 9999) < 760);
  if (pocket) document.documentElement.className = 'pocket';
  /* The code for anyone in the room, only where the phone itself serves the page (not the website demo, not a Chromecast). */
  function follow(text) {
    if (demo || casting || pocket || /[?&]noqr(&|$)/.test(location.search)) return '';
    return '<div class="follow"><img src="' + location.pathname.replace(/\/$/, '') + '/qr.svg" alt="' + esc(tr('Follow on your phone')) + '"><div><b>' + tr('Follow on your phone') + '</b>' + tr(text) + '</div></div>';
  }
  function footer() {
    var t = state && state.match && state.match.tournament;
    return '<footer><span class="mark">' + mark() + 'Still Point</span><span class="dot' + (connected ? '' : ' off') + '"></span>' +
      '<span>' + tr(demo ? 'Demo' : ended ? 'This link has ended' : connected ? 'Live' : 'Reconnecting…') + '</span>' + (soundLocked ? '<span class="snd">' + tr('Click or press OK for sound') + '</span>' : '') + '<span class="grow"></span>' +
      (t ? '<span>' + esc(t.name) + (t.board ? ' · ' + tr('Board {n}', { n: esc(t.board) }) : '') + '</span>' : '') + '</footer>';
  }

  /* A dartboard with the visit's beds lit. The scorer reports a bed (T20, S5), not a point on the
     board, so a whole bed lights up; a single lights both of its single areas. */
  var ORDER = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
  var R = { db: 10, sb: 22, t0: 96, t1: 112, d0: 150, d1: 166, num: 186 };
  function xy(r, deg) { var a = deg * Math.PI / 180; return [+(r * Math.cos(a)).toFixed(1), +(r * Math.sin(a)).toFixed(1)]; }
  function bed(r0, r1, k) {
    var a0 = -99 + k * 18, a1 = a0 + 18, p = xy(r0, a0), q = xy(r1, a0), u = xy(r1, a1), v = xy(r0, a1);
    return 'M' + p + 'L' + q + 'A' + r1 + ' ' + r1 + ' 0 0 1 ' + u + 'L' + v + 'A' + r0 + ' ' + r0 + ' 0 0 0 ' + p + 'Z';
  }
  var BOARD = null;
  function boardBase() {
    if (BOARD) return BOARD;
    var s = '', nums = '';
    ORDER.forEach(function (n, k) {
      s += '<path class="w' + (k % 2) + '" d="' + bed(R.sb, R.d1, k) + '"/>' +
        '<path class="' + (k % 2 ? 'rg' : 'rr') + '" d="' + bed(R.t0, R.t1, k) + bed(R.d0, R.d1, k) + '"/>';
      var c = xy(R.num, -90 + k * 18);
      nums += '<text x="' + c[0] + '" y="' + c[1] + '">' + n + '</text>';
    });
    return (BOARD = s + '<circle r="' + R.sb + '" class="rg"/><circle r="' + R.db + '" class="rr"/><g class="nums">' + nums + '</g>');
  }
  /* points[i], when the camera measured it: where dart i really landed, as fractions of the double ring
     (x right, y down, 20 at the top). The bed still lights; the pin moves to the spot. */
  function boardSvg(darts, points) {
    var lit = '', pins = '', seen = {};
    (darts || []).slice(0, 3).forEach(function (d, i) {
      var bull = d === 'SB' || d === 'DB', m = /^([SDT])(\d+)$/.exec(d || ''), k = m ? ORDER.indexOf(+m[2]) : -1;
      if (!bull && k < 0) return; // a miss lights nothing; its cell already says so
      var n = seen[d] = (seen[d] || 0) + 1, at;
      if (d === 'DB') { lit += '<circle class="lit" r="' + R.db + '"/>'; at = n === 1 ? [0, 0] : xy(16, -90 + n * 120); }
      else if (d === 'SB') { lit += '<path class="lit" fill-rule="evenodd" d="M' + R.sb + ' 0A' + R.sb + ' ' + R.sb + ' 0 1 0 -' + R.sb + ' 0A' + R.sb + ' ' + R.sb + ' 0 1 0 ' + R.sb + ' 0ZM' + R.db + ' 0A' + R.db + ' ' + R.db + ' 0 1 1 -' + R.db + ' 0A' + R.db + ' ' + R.db + ' 0 1 1 ' + R.db + ' 0Z"/>'; at = xy(16, -90 + n * 120); }
      else {
        // A number sits just inside its ring, so the lit ring itself stays visible.
        var t = m[1], r = t === 'T' ? R.t0 - 20 : t === 'D' ? R.d0 - 20 : (R.t1 + R.d0) / 2;
        lit += '<path class="lit" d="' + (t === 'S' ? bed(R.sb, R.t0, k) + bed(R.t1, R.d0, k) : t === 'T' ? bed(R.t0, R.t1, k) : bed(R.d0, R.d1, k)) + '"/>';
        // Darts in the same bed fan out along it so each number stays readable.
        at = xy(t === 'S' && n > 1 ? r - 30 * (n - 1) : r, -90 + k * 18 + (t === 'S' || n === 1 ? 0 : (t === 'T' ? 30 : 20) * (n === 2 ? 1 : -1)));
      }
      var pt = points && points[i];
      if (pt && isFinite(pt[0]) && isFinite(pt[1])) {
        // The measured spot: a small mark where the tip went in, the number beside it.
        var sx = +(pt[0] * R.d1).toFixed(1), sy = +(pt[1] * R.d1).toFixed(1);
        pins += '<g class="pin spot"><circle class="tip" cx="' + sx + '" cy="' + sy + '" r="6"/><circle cx="' + (sx + 16) + '" cy="' + (sy - 16) + '" r="15"/><text x="' + (sx + 16) + '" y="' + (sy - 16) + '">' + (i + 1) + '</text></g>';
      } else pins += '<g class="pin"><circle cx="' + at[0] + '" cy="' + at[1] + '" r="19"/><text x="' + at[0] + '" y="' + at[1] + '">' + (i + 1) + '</text></g>';
    });
    return '<svg class="board" viewBox="-205 -205 410 410" aria-hidden="true">' + boardBase() + lit + pins + '</svg>';
  }

  /* Where the darts went: every camera-scored dart of the night as a dot on that player's board,
     the dots arriving one after another. Only measured darts; the phone sends nothing it guessed. */
  function heatView(list) {
    if (!list || !list.length) return '';
    var boards = list.map(function (h) {
      var dots = h.points.map(function (pt, i) {
        var x = +(pt[0] * R.d1).toFixed(1), y = +(pt[1] * R.d1).toFixed(1);
        return '<circle class="hd" cx="' + x + '" cy="' + y + '" r="7" style="animation-delay:' + (i * 9000 / h.points.length).toFixed(0) + 'ms"/>';
      }).join('');
      return '<div class="hb"><svg class="board" viewBox="-205 -205 410 410" aria-hidden="true">' + boardBase() + dots + '</svg>' +
        '<div class="hw"><div class="hn">' + esc(h.name) + '</div><div class="hl">' + tr('{n} darts', { n: h.darts }) + '</div>' + (h.top ? '<div class="hl">' + tr('most in {bed}', { bed: esc(h.top) }) + '</div>' : '') + '</div></div>';
    }).join('');
    return '<div class="heat"><h2>' + tr('Where the darts went') + '</h2><div class="sub">' + tr('Every dart the camera scored tonight') + '</div><div class="hbs" style="--hc:' + (list.length > 2 ? 2 : list.length) + '">' + boards + '</div></div>';
  }

  /* Lines for each player over a leg or a match. [series] holds numbers per player; [lo, hi] the range. */
  function chart(series, names, opts) {
    var W = 1000, H = opts.height || 220, left = 56, right = 200, top = 14, bottom = H - 14;
    var longest = 0; series.forEach(function (s) { longest = Math.max(longest, s.length); });
    if (longest < 2) return '';
    var lo = opts.lo, hi = opts.hi;
    function X(i) { return left + (W - left - right) * i / (longest - 1); }
    function Y(v) { return bottom - (bottom - top) * (v - lo) / ((hi - lo) || 1); }
    var out = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">';
    (opts.grid || []).forEach(function (g) {
      out += '<line class="grid" x1="' + left + '" x2="' + (W - right) + '" y1="' + Y(g).toFixed(1) + '" y2="' + Y(g).toFixed(1) + '"/>' +
        '<text class="axis" x="' + (left - 12) + '" y="' + (Y(g) + 7).toFixed(1) + '" text-anchor="end">' + g + '</text>';
    });
    // End labels never sit on top of each other.
    var ends = [];
    series.forEach(function (s, p) {
      if (!s.length) return;
      out += '<polyline class="ln p' + p + '" points="' + s.map(function (v, i) { return X(i).toFixed(1) + ',' + Y(v).toFixed(1); }).join(' ') + '"/>' +
        '<circle class="dot p' + p + '" r="8" cx="' + X(s.length - 1).toFixed(1) + '" cy="' + Y(s[s.length - 1]).toFixed(1) + '"/>';
      ends.push({ p: p, x: X(s.length - 1) + 18, y: Y(s[s.length - 1]), text: names[p] + (opts.label ? '  ' + opts.label(s[s.length - 1]) : '') });
    });
    ends.sort(function (a, b) { return a.y - b.y; });
    for (var i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 30) ends[i].y = ends[i - 1].y + 30;
    ends.forEach(function (e) { out += '<text class="end p' + e.p + '" x="' + e.x.toFixed(1) + '" y="' + e.y.toFixed(1) + '">' + esc(e.text) + '</text>'; });
    return out + '</svg>';
  }

  /* The race to zero in a leg: what each player had left after every visit. */
  function raceChart(l) {
    if (!l || !l.paths || l.paths.length < 2 || l.paths.length > 4) return '';
    var top = 0; l.paths.forEach(function (p) { if (p.length) top = Math.max(top, p[0]); });
    var names = (l.averages || []).map(function (a) { return a.name; });
    return chart(l.paths, names, { lo: 0, hi: top, grid: [0, Math.round(top / 2), top], height: 200 });
  }

  /* The match average after every visit, for the result screen. */
  function momentumChart(m) {
    var mo = m.momentum;
    if (!mo || mo.length < 2 || mo.length > 4) return '';
    var series = mo.map(function (p) { return (p.averages || []).map(Number).filter(function (v) { return isFinite(v); }); });
    var all = [].concat.apply([], series);
    if (all.length < 6) return '';
    var lo = Math.floor(Math.min.apply(null, all) / 20) * 20, hi = Math.ceil(Math.max.apply(null, all) / 20) * 20;
    if (hi - lo < 40) hi = lo + 40;
    var grid = []; for (var g = lo; g <= hi; g += 20) grid.push(g);
    var svg = chart(series, mo.map(function (p) { return p.name; }), { lo: lo, hi: hi, grid: grid, height: 260, label: function (v) { return v.toFixed(1); } });
    return svg ? svg + '<div class="cap">' + tr('3-dart average through the match') + '</div>' : '';
  }

  /* The match numbers the phone sent for a player (state.match.stats), matched by name. */
  function statsOf(m, name) { return (m.stats || []).filter(function (s) { return s.name === name; })[0] || null; }
  /* The result headline keeps to one line: a long name (a pair, a full name) shrinks it to the width. */
  function headlineFit(text, charted) {
    var portrait = window.matchMedia && matchMedia('(orientation: portrait)').matches;
    var base = portrait ? (charted ? '15vw' : '18vh') : (charted ? '12vh' : '18vh');
    return 'font-size:min(' + base + ', ' + (150 / Math.max(6, String(text).length)).toFixed(2) + 'vw)';
  }
  /* Pairs: each partner's average (state.match.partners), under their side's card. */
  function partnerLine(m, name) {
    var side = (m.partners || []).filter(function (s) { return s.name === name; })[0];
    if (!side || !side.partners || !side.partners.length) return '';
    return '<div class="prt">' + side.partners.map(function (p) {
      return '<span><b>' + esc(p.name) + '</b> ' + esc(p.average || '\u2014') + (p.cricket ? ' ' + tr('MPR') : '') + (p.t180 ? ' \u00b7 180\u00d7' + p.t180 : '') + (p.highOut ? ' \u00b7 ' + esc(tr('{n} out', { n: p.highOut })) : '') + '</span>';
    }).join('') + '</div>';
  }
  function checkoutText(s) { return s.checkoutRate ? s.checkoutRate : s.finishes ? tr('{n} out', { n: s.finishes }) : '—'; }
  function keyStats(s) {
    if (!s) return '';
    var cells = [[checkoutText(s), tr('Checkout')], [s.highOut ? String(s.highOut) : '—', tr('High out')]];
    if (s.t180) cells.push([String(s.t180), tr('180s')]);
    else if (s.bestLeg) cells.push([s.bestLeg + ' ' + tr('darts'), tr('Best leg')]);
    return '<div class="ks">' + cells.map(function (c) { return '<div><b>' + esc(c[0]) + '</b><span>' + esc(c[1]) + '</span></div>'; }).join('') + '</div>';
  }

  function dartCells(m) {
    var out = '';
    for (var i = 0; i < 3; i++) {
      var d = m.darts[i];
      out += d ? '<div class="dart num">' + esc(d) + '</div>' : '<div class="dart empty' + (i === m.darts.length && !m.complete && !m.bust ? ' next' : '') + '"></div>';
    }
    return out;
  }

  /* Cricket: 20 down to 15 and the bull, as the phone counts them (marks per player, 0–3). */
  var CRICKET = ['20', '19', '18', '17', '16', '15', 'Bull'];
  function markSvg(n) {
    var g = '';
    if (n >= 1) g += '<line x1="-30" y1="30" x2="30" y2="-30"/>';
    if (n >= 2) g += '<line x1="-30" y1="-30" x2="30" y2="30"/>';
    if (n >= 3) g += '<circle r="46"/>';
    return '<svg viewBox="-50 -50 100 100" aria-hidden="true">' + g + '</svg>';
  }
  function cricketBoard(m) {
    var ps = m.players, n = ps.length, two = n === 2, scoring = m.mode === 'CRICKET';
    function marks(p, k) { return (p.marks && p.marks[k]) || 0; }
    function closedByAll(k) { return ps.every(function (p) { return marks(p, k) >= 3; }); }
    function head(p, i) {
      var active = i === m.current;
      return '<div class="hd' + (active ? ' active' : '') + '"><div class="nm">' + esc(p.name) + '</div>' +
        (p.thrower ? '<div class="thrower">' + tr(active ? 'Throwing' : 'Next') + ': <b>' + esc(p.thrower) + '</b></div>' : '') +
        '<div class="pts num">' + esc(scoring ? p.score : marks(p, 0) + marks(p, 1) + marks(p, 2) + marks(p, 3) + marks(p, 4) + marks(p, 5) + marks(p, 6)) + '</div>' +
        '<div class="ds">' + (active ? m.darts.map(function (d) { return '<span class="num">' + esc(d) + '</span>'; }).join('') : '') + '</div></div>';
    }
    function cell(p, k) {
      var mk = marks(p, k), dead = closedByAll(k);
      // Closed here while someone else is still open: this player scores on it (in the game with points).
      var open = !dead && mk >= 3 && scoring && ps.some(function (q) { return q !== p && marks(q, k) < 3; });
      var label = p.name + ', ' + CRICKET[k] + ': ' + mk + ' of 3';
      return '<div class="mk' + (dead ? ' dead' : open ? ' open' : '') + '" role="img" aria-label="' + esc(label) + '">' + markSvg(mk) + '</div>';
    }
    // The numbers' column grows to its widest label ("Bull"), whatever the screen.
    var cols = two ? 'minmax(0,1fr) minmax(10vw, max-content) minmax(0,1fr)' : 'minmax(9vw, max-content) repeat(' + n + ', minmax(0,1fr))';
    if (pocket) cols = two ? 'minmax(0,1fr) minmax(56px, max-content) minmax(0,1fr)' : 'minmax(44px, max-content) repeat(' + n + ', minmax(0,1fr))';
    var out = '<div class="ck" style="grid-template-columns:' + cols + ';grid-template-rows:auto repeat(7, minmax(0,1fr))">';
    out += two ? head(ps[0], 0) + '<div></div>' + head(ps[1], 1) : '<div></div>' + ps.map(head).join('');
    CRICKET.forEach(function (t, k) {
      var tg = '<div class="tg num' + (closedByAll(k) ? ' dead' : '') + '">' + t + '</div>';
      out += two ? cell(ps[0], k) + tg + cell(ps[1], k) : tg + ps.map(function (p) { return cell(p, k); }).join('');
    });
    return out + '</div>';
  }

  function renderMatch(m) {
    var t = m.tournament;
    var head = '<header><div class="title">' + esc(t ? trRound(t.round) + ' · ' + m.title : m.title) + '</div><div class="context">' +
      esc(m.paused ? tr('Paused') : trRound(m.context)) + '</div></header>';
    if (m.complete) {
      var winner = String(m.result || '').replace(' wins', '');
      var resultText = / wins$/.test(m.result || '') ? tr(/ & /.test(winner) ? '{name} win' : '{name} wins', { name: winner }) : tr(m.result || 'Game complete');
      var momentum = momentumChart(m);
      return head + '<main><div class="result' + (momentum ? ' charted' : '') + '"><div class="headline" style="' + headlineFit(resultText, !!momentum) + '">' + esc(resultText) + '</div><div class="cards">' +
        m.players.slice(0, 4).map(function (p) {
          // Cricket has no average: its card shows the points (or the marks, without points).
          if (m.mode === 'CRICKET' || m.mode === 'CRICKET_NO_SCORE') {
            var mk = (p.marks || []).reduce(function (a, b) { return a + b; }, 0);
            return '<div class="card' + (p.name === winner ? ' win' : '') + '"><div class="nm">' + esc(p.name) + '</div><div class="av num">' + esc(m.mode === 'CRICKET' ? p.score : mk) +
              '</div><div class="lg">' + tr(m.mode === 'CRICKET' ? 'points' : 'marks') + (m.mode === 'CRICKET' ? ' · ' + mk + ' ' + tr('marks') : '') + '</div>' + partnerLine(m, p.name) + '</div>';
          }
          return '<div class="card' + (p.name === winner ? ' win' : '') + '"><div class="nm">' + esc(p.name) + '</div><div class="av num">' + esc(p.average || '—') +
            '</div><div class="lg">' + tr('3-dart average') + (m.showLegs ? ' · ' + (p.sets ? tr('{n} sets', { n: p.sets }) + ' · ' : '') + p.legs + ' ' + tr(p.legs === 1 ? 'leg' : 'legs') : '') + '</div>' +
            keyStats(statsOf(m, p.name)) + partnerLine(m, p.name) + '</div>';
        }).join('') + '</div>' + momentum + '</div></main>' + footer();
    }
    var many = m.players.length > 2;
    var body;
    if ((m.mode === 'CRICKET' || m.mode === 'CRICKET_NO_SCORE') && m.players.length <= 4)
      return head + '<main>' + cricketBoard(m) + '</main>' + footer();
    if (m.players.length <= 2) {
      body = m.players.map(function (p, i) {
        var active = i === m.current;
        var legs = m.showLegs ? (p.sets ? tr('Sets {n}', { n: p.sets }) + ' · ' : '') + tr('Legs {n}', { n: p.legs }) : '';
        return '<section class="panel' + (active ? (m.bust ? ' bust' : ' active') : '') + '">' +
          '<div class="who"><div class="avatar">' + initial(p.name) + '</div><div class="name">' + esc(p.name) + '</div>' +
          '<div class="badge' + (active ? ' throwing' : '') + '">' + (active ? (m.bust ? tr('Bust') + (m.bustReason ? ' · ' + esc(tr(m.bustReason)) : '') : tr('Throwing')) : esc(legs)) + '</div></div>' +
          (p.thrower ? '<div class="thrower">' + tr(active ? 'Throwing' : 'Next') + ': <b>' + esc(p.thrower) + '</b></div>' : '') +
          '<div class="score num">' + esc(p.score) + '</div>' +
          '<div class="foot"><div class="stack"><div class="facts">' + (active && legs ? '<span>' + esc(legs) + '</span>' : '') + (p.average ? '<span><b>' + esc(p.average) + '</b> ' + tr('{n} avg', { n: '' }).replace(/^\s+|\s+$/g, '') + '</span>' : '') +
          (!active && p.lastTotal ? '<span>' + tr('Last {n}', { n: '<b>' + esc(p.lastTotal) + '</b>' }) + '</span>' : '') + '</div>' +
          (active && m.checkout && m.checkout.length ? '<div class="checkout"><small>' + tr('Checkout') + '</small>' + m.checkout.map(esc).join(' &nbsp;') + '</div>' : '') +
          (active && m.target ? '<div class="checkout"><small>' + tr('Target') + '</small>' + esc(m.target) + '</div>' : '') +
          (active ? '<div class="darts">' + dartCells(m) + '</div>' : (p.last && p.last.length ? '<div class="last">' + p.last.map(esc).join(' · ') + '</div>' : '')) +
          '</div>' + (m.mode === 'X01' && (active || (p.last && p.last.length)) ? boardSvg(active ? m.darts : p.last, active ? m.points : p.lastPoints) : '') + '</div></section>';
      }).join('');
    } else {
      body = '<div class="rows many">' + m.players.map(function (p, i) {
        var active = i === m.current, line = '';
        if (active && m.bust) line = '<span class="bustword">' + tr('Bust') + (m.bustReason ? ' · ' + esc(tr(m.bustReason)) : '') + '</span>';
        else if (active && (m.darts.length || (m.checkout && m.checkout.length))) line = m.darts.map(function (d) { return '<span class="chip num">' + esc(d) + '</span>'; }).join('') +
          (m.checkout && m.checkout.length ? '<span class="co">' + m.checkout.map(esc).join(' ') + '</span>' : '');
        return '<div class="row' + (active ? (m.bust ? ' bust' : ' active') : '') + '"><div class="avatar">' + initial(p.name) + '</div><div class="mid"><div class="name">' + esc(p.name) +
          '</div>' + (p.thrower ? '<div class="avgp" style="display:block">' + tr(active ? 'Throwing' : 'Next') + ': ' + esc(p.thrower) + '</div>' : '') + (line ? '<div class="line">' + line + '</div>' : '') + (p.average ? '<div class="avgp">' + tr('{n} avg', { n: esc(p.average) }) + '</div>' : '') + '</div><div class="badge">' + (p.average ? tr('{n} avg', { n: esc(p.average) }) : '') + '</div><div class="score num">' + esc(p.score) + '</div></div>';
      }).join('') + '</div>';
    }
    return head + '<main>' + body + '</main>' + footer();
  }

  function fixture(f) {
    return '<div class="fix' + (f.board ? ' live' : '') + '"><div class="vs"><div>' + esc(f.home) + ' v ' + esc(f.away) + '</div><div>' + esc(trRound(f.round)) + '</div></div>' +
      (f.score ? '<div class="bd num" style="color:var(--white)">' + esc(f.score) + '</div>' : '') +
      (f.board ? '<div class="bd">' + tr('Board {n}', { n: esc(f.board) }) + '</div>' : '') + '</div>';
  }

  /* The bracket fills the stage it is given: its shape follows the screen, so a TV gets big cards. */
  function bracket(t, boxW, boxH) {
    var rounds = t.rounds || [];
    if (!rounds.length) return '';
    var first = rounds[0].matches.length, cols = rounds.length;
    var unit = 100, top = 40, H = top + first * unit + (t.third ? 140 : 0);
    var W = Math.max(cols * 280, H * (boxW > 0 && boxH > 0 ? boxW / boxH : 2));
    var colW = W / cols, cardW = colW * 0.84;
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">';
    function card(x, y, f, h) {
      var s = '<g opacity="' + (f.status === 'bye' ? 0.4 : 1) + '"><rect x="' + x + '" y="' + y + '" width="' + cardW + '" height="' + h + '" rx="10" style="fill:var(' + (f.status === 'live' ? '--greenfield' : '--surface') + ')' +
        (f.status === 'live' ? ';stroke:var(--green)" stroke-width="3"' : '"') + '/>';
      [['home', 'hs', 'hl'], ['away', 'as', 'al']].forEach(function (k, j) {
        var name = f[k[0]] || f[k[2]] || '', won = f.winner === k[0];
        var ty = y + h * (j === 0 ? 0.38 : 0.78);
        s += '<text x="' + (x + 12) + '" y="' + ty + '" font-size="' + (h * 0.26) + '" font-weight="' + (won ? 800 : 500) + '" style="fill:var(' +
          (!f[k[0]] ? '--muted' : (f.winner && !won ? '--muted' : '--white')) + ')">' + esc(name.length > 18 ? name.slice(0, 17) + '…' : name) + '</text>';
        if (f[k[1]] != null) s += '<text x="' + (x + cardW - 12) + '" y="' + ty + '" text-anchor="end" font-size="' + (h * 0.28) + '" font-weight="900" style="fill:var(' + (won ? '--green' : '--muted') + ')">' + esc(f[k[1]]) + '</text>';
      });
      return s + '</g>';
    }
    rounds.forEach(function (r, ri) {
      out += '<text x="' + (ri * colW + 4) + '" y="28" font-size="26" font-weight="800" style="fill:var(--muted)">' + esc(trRound(roundTitle(r.name))) + '</text>';
      var span = Math.pow(2, ri) * unit;
      r.matches.forEach(function (f, i) {
        var cy = top + (i + 0.5) * span, x = ri * colW, h = unit * 0.8;
        if (ri < cols - 1) {
          var py = top + (Math.floor(i / 2) + 0.5) * span * 2, mx = x + cardW + (colW - cardW) / 2;
          out += '<path d="M' + (x + cardW) + ' ' + cy + ' H' + mx + ' V' + py + (i % 2 === 0 ? ' H' + (x + colW) : '') + '" style="stroke:var(--raised)" stroke-width="3" fill="none"/>';
        }
        out += card(x, cy - h / 2, f, h);
      });
    });
    if (t.third) {
      var tx = (cols - 1) * colW;
      out += '<text x="' + tx + '" y="' + (top + first * unit + 30) + '" font-size="20" style="fill:var(--muted)" font-weight="800">' + esc(tr('Third place')) + '</text>' + card(tx, top + first * unit + 44, t.third, 80);
    }
    return out + '</svg>';
  }

  function mini(f) {
    function line(k, s, l) {
      var won = f.winner === k;
      return '<div class="ml' + (won ? ' w' : '') + (f[k] ? '' : ' x') + '"><span>' + esc(f[k] || f[l] || '') + '</span><b>' + (f[s] == null ? '' : esc(f[s])) + '</b></div>';
    }
    return '<div class="mini' + (f.status === 'live' ? ' live' : '') + (f.status === 'bye' ? ' bye' : '') + '">' + line('home', 'hs', 'hl') + line('away', 'as', 'al') + '</div>';
  }

  function roundTitle(n) { return /-final$/.test(n) ? n + 's' : n; }

  function tables(t) {
    var most = 1; t.tables.forEach(function (tb) { most = Math.max(most, tb.rows.length); });
    var size = Math.max(2.6, Math.min(4.6, (t.tables.length > 2 ? 30 : 58) / most));
    return '<div class="tables" style="--table:' + size.toFixed(2) + 'vh">' + t.tables.map(function (tb) {
      return '<div><h3>' + esc(tb.name) + '</h3><table><tr><th></th><th>' + tr('Player') + '</th><th>' + tr('P') + '</th><th>' + tr('W') + '</th><th>+/−</th><th>' + tr('Pts') + '</th></tr>' +
        tb.rows.map(function (r) {
          return '<tr class="' + (r.through ? 'through' : '') + '"><td>' + esc(r.rank) + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.p) + '</td><td>' + esc(r.w) +
            '</td><td>' + (r.diff > 0 ? '+' : '') + esc(r.diff) + '</td><td>' + esc(r.pts) + '</td></tr>';
        }).join('') + '</table></div>';
    }).join('') + '</div>';
  }

  // Previews can pin the Order of Merit instead of waiting for the rotation.
  var forceMerit = /[?&]merit(&|$)/.test(location.search);
  function medal(p) { return p === 1 ? 'gold' : p === 2 ? 'silver' : p === 3 ? 'bronze' : ''; }

  /** The club ranking: rank, name, last finishes, points. Rows shrink to fit up to twelve. */
  /* Tonight's highs across the host phone's finished X01 matches; the phone leaves out empty ones. */
  function tonightView(t) {
    var n = t.matches;
    return '<div class="slide tonight"><h2>' + tr('Tonight') + '</h2><div class="sub">' + tr(n === 1 ? '1 match played' : '{n} matches played', { n: esc(n) }) + '</div>' +
      '<div class="highs">' + t.highs.map(function (h) {
        return '<div class="hi"><div class="l">' + esc(tr(h.label)) + '</div><div class="v num">' + esc(h.value) + (h.darts ? '<small>' + tr('darts') + '</small>' : '') +
          '</div><div class="n">' + esc(h.name) + '</div></div>';
      }).join('') + '</div></div>';
  }

  function meritView(rows) {
    var size = Math.max(2.2, Math.min(4.2, (66 / Math.max(rows.length, 1) - 3) / 1.3));
    return '<div class="merit" style="--mrow:' + size.toFixed(2) + 'vh"><h2>' + tr('Order of Merit') + '</h2><div class="sub">' + tr('Points from every finished tournament') + '</div>' +
      rows.map(function (r) {
        return '<div class="mrow"><div class="rk ' + medal(r.rank) + '">' + (r.shared ? '=' : esc(r.rank)) + '</div><div class="nm">' + esc(r.name) +
          '</div><div class="ev">' + tr('{n} played', { n: esc(r.events) }) + (r.titles ? ' · ' + esc(r.titles) + ' ' + tr(r.titles === 1 ? 'title' : 'titles') : '') + '</div>' +
          '<div class="form">' + (r.recent || []).map(function (p) { return '<i class="' + medal(p) + '">' + esc(p) + '</i>'; }).join('') + '</div>' +
          '<div class="pt num">' + esc(r.points) + '</div></div>';
      }).join('') + '</div>';
  }

  /* How the champion got there, from the bracket's own results; and the closest match of the night. */
  function story(t) {
    if (!t || !t.complete || !t.champion) return null;
    var all = [], road = [], legs = 0, played = 0;
    [].concat((t.rounds || []), (t.losers || []), [{ name: 'Grand final', matches: t.grand || [] }]).forEach(function (r) {
      (r.matches || []).forEach(function (c) { all.push({ round: r.name, c: c }); });
    });
    if (t.third) all.push({ round: 'Third place', c: t.third });
    all.forEach(function (x) {
      var c = x.c;
      if (c.status !== 'done' || !c.home || !c.away || c.hs == null || c.as == null) return;
      played++; legs += (+c.hs) + (+c.as);
      if (c.home === t.champion || c.away === t.champion) {
        var home = c.home === t.champion;
        road.push({ round: x.round, opp: home ? c.away : c.home, my: home ? c.hs : c.as, their: home ? c.as : c.hs, won: (c.winner === 'home') === home });
      }
    });
    // Closest: the smallest margin, then the most legs, then the later match (the final wins a tie).
    var closest = null;
    all.forEach(function (x, i) {
      var c = x.c;
      if (c.status !== 'done' || !c.home || !c.away || c.hs == null || c.as == null) return;
      var margin = Math.abs(c.hs - c.as), total = (+c.hs) + (+c.as);
      if (!closest || margin < closest.margin || (margin === closest.margin && (total > closest.total || (total === closest.total && i > closest.i))))
        closest = { margin: margin, total: total, i: i, x: x };
    });
    return { road: road, legs: legs, played: played, closest: closest };
  }
  function closestText(cl) {
    var c = cl.x.c, w = c.winner === 'home';
    return (w ? c.home : c.away) + ' ' + (w ? c.hs : c.as) + '–' + (w ? c.as : c.hs) + ' ' + (w ? c.away : c.home);
  }
  function storyView(t) {
    var st = story(t);
    if (!st || !st.road.length) return '';
    return '<div class="story"><h2>' + tr('How {name} won it', { name: esc(t.champion) }) + '</h2><div class="road">' + st.road.map(function (r) {
      return '<div class="step' + (r.won ? '' : ' lost') + '"><div class="rd">' + esc(trRound(r.round)) + '</div><div class="op">' + tr(r.won ? 'Beat {name}' : 'Lost to {name}', { name: esc(r.opp) }) +
        '</div><div class="sc num">' + esc(r.my) + '–' + esc(r.their) + '</div></div>';
    }).join('') + '</div><div class="facts"><div><b class="num">' + st.played + '</b><span>' + tr('Matches') + '</span></div><div><b class="num">' + st.legs + '</b><span>' + tr('Legs played') + '</span></div>' +
      (st.closest ? '<div class="close"><b>' + esc(closestText(st.closest)) + '</b><span>' + tr('Closest match') + ' · ' + esc(trRound(st.closest.x.round)) + '</span></div>' : '') + '</div></div>';
  }
  function pstory(t) {
    var st = story(t);
    if (!st || !st.road.length) return '';
    return '<div class="ph">' + tr('How {name} won it', { name: esc(t.champion) }) + '</div><div class="pstory">' + st.road.map(function (r) {
      return '<div class="step' + (r.won ? '' : ' lost') + '"><span class="rd">' + esc(trRound(r.round)) + '</span><span class="op">' + tr(r.won ? 'Beat {name}' : 'Lost to {name}', { name: esc(r.opp) }) +
        '</span><span class="sc">' + esc(r.my) + '–' + esc(r.their) + '</span></div>';
    }).join('') + '</div>' + (st.closest ? '<div class="pnow"><div class="k">' + tr('Closest match') + ' · ' + esc(trRound(st.closest.x.round)) + '</div><div class="h">' + esc(closestText(st.closest)) + '</div><div class="s">' +
      tr('{m} matches · {l} legs played', { m: st.played, l: st.legs }) + '</div></div>' : '');
  }

  /* Every live board side by side: whose turn, the scores, this visit's darts and the way out. Each
     board's panel comes from that board's own phone; nothing is scored here. */
  function boardsOn(t, m) {
    var list = ((t && t.boards) || []).slice();
    if (m && m.tournament && m.tournament.board) {
      list = list.filter(function (b) { return b.board !== m.tournament.board; });
      list.push({ board: m.tournament.board, round: m.tournament.round, model: m, mine: true });
    }
    return list.sort(function (a, b) { return a.board - b.board; });
  }
  function bpanel(b) {
    var m = b.model, ps = m.players || [];
    var rows = ps.slice(0, 4).map(function (p, i) {
      var on = i === m.current && !m.complete, line = '';
      if (on && m.bust) line = tr('Bust');
      else if (on) {
        // This visit's darts, then the way out, where the eye already is.
        if (m.darts && m.darts.length) line = m.darts.map(esc).join(' · ') + ' = <b>' + esc(m.visit) + '</b>';
        if (m.checkout && m.checkout.length) line += (line ? ' · ' : '') + '<b>' + m.checkout.map(esc).join(' ') + '</b>';
        if (!line) line = tr('Throwing');
      }

      if (polling || Date.now() - heard < 35000) return;
      heard = Date.now(); connected = false; render();
      try { es.close(); } catch (e) {}
      listen();
    }, 5000);
    // A phone that slept or left the Wi-Fi catches up the moment it is looked at again.
    document.addEventListener('visibilitychange', function () {
      if (document.hidden || polling) return;
      var x = new XMLHttpRequest();
      x.open('GET', base + '/state');
      x.onload = function () { if (x.status === 200) accept(x.responseText); };
      x.send();
      if (es.readyState === 2) listen();
    });
  } else { poll(); }
})();
</script>
